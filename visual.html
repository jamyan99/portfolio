<style>

/* ==========================================================================
   Tokens
   Site chrome: zinc neutrals, Satoshi + Inter, 20px card radius (measured
   from the live Framer site). ContentPlus brand palette is sampled from the
   page's own style guide board and is only used inside ContentPlus content.
   ========================================================================== */
:root {
  --bg: #F4F4F5;
  --surface: #FFFFFF;
  --surface-sunk: #FAFAFA;
  --ink: #18181B;
  --ink-dim: #5F5F63;
  --line: #E4E4E7;

  --brand-purple: #6C3CF0;  /* eyebrow text: brand purple, passes AA on --bg */
  --brand-mint: #7CF6C5;
  --brand-yellow: #F9EB5F;
  --brand-orange: #E86A44;

  --font-display: "Satoshi", "Inter", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;

  --radius: 20px;
  --radius-sm: 12px;

  /* spacing scale */
  --space-2xs: 8px;
  --space-xs: 12px;
  --space-s: 16px;
  --space-m: 24px;
  --space-l: 40px;
  --space-xl: 64px;
  --space-2xl: 112px;

  /* rhythm */
  --gap-section: var(--space-2xl);  /* between Tier 2 sections   */
  --gap-block: var(--space-xl);     /* between Tier 3 blocks      */
  --card-pad: var(--space-l);       /* inside every white card    */

  /* type scale — Tier 2 is 1.8x Tier 3 and a heavier weight */
  --h1: 44px;
  --t2: 36px;
  --t3: 20px;
  --t1: 14px;
}

@media (max-width: 760px) {
  :root {
    --gap-section: 72px;
    --gap-block: 48px;
    --card-pad: var(--space-m);
    --h1: 34px;
    --t2: 28px;   /* 1.56x Tier 3 */
    --t3: 18px;
  }
}

/* ==========================================================================
   Base
   ========================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 16px/1.6 var(--font-body);
  -webkit-font-smoothing: antialiased;
}
img, video { display: block; max-width: 100%; }
h1, h2, h3, h4, p, figure, dl, dd { margin: 0; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--brand-purple); outline-offset: 3px; border-radius: 4px; }
strong { font-weight: 500; color: var(--ink); }

.skip-link {
  position: absolute; left: 16px; top: -48px;
  background: var(--ink); color: #fff; padding: 10px 14px; border-radius: 8px;
  font-size: 14px; text-decoration: none; z-index: 20;
}
.skip-link:focus { top: 12px; }

/* ==========================================================================
   Layout
   ========================================================================== */

.layout {
  max-width: 1240px; margin: 0 auto; padding: 40px 24px 0;
  display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 56px;
}
.content { min-width: 0; max-width: 960px; }

.rail {
  position: sticky; top: 32px; align-self: start;
  background: var(--surface); border-radius: var(--radius-sm); padding: 10px 16px;
}
.rail a {
  display: block; padding: 6px 0; font-size: 13px; line-height: 1.5;
  color: var(--ink-dim); text-decoration: none;
}
.rail a:hover { color: var(--ink); }
.rail a[aria-current="true"] { color: var(--ink); font-weight: 500; }

@media (max-width: 1000px) {
  .layout { grid-template-columns: 1fr; gap: 0; padding-top: 0; }
  .rail {
    position: sticky; top: 0; z-index: 10;
    display: flex; gap: 22px; overflow-x: auto;
    margin: 0 -24px 32px; padding: 12px 24px; border-radius: 0;
    border-bottom: 1px solid var(--line); scrollbar-width: none;
  }
  .rail::-webkit-scrollbar { display: none; }
  .rail a { white-space: nowrap; padding: 0; }
}

/* ==========================================================================
   Type tiers
   Tier 1 eyebrow · Tier 2 section heading · Tier 3 subheading
   ========================================================================== */
.eyebrow { font: 500 var(--t1)/1.4 var(--font-body); color: var(--brand-purple); margin-bottom: var(--space-2xs); }
.t2 { font: 700 var(--t2)/1.15 var(--font-display); letter-spacing: -0.02em; }
.t3 { font: 500 var(--t3)/1.3 var(--font-display); letter-spacing: -0.005em; }
.body { color: var(--ink-dim); max-width: 64ch; }
.t3 + .body, .t3 + .body-group { margin-top: var(--space-xs); }
.body + .body { margin-top: var(--space-s); }
.section-head .body { margin-top: var(--space-m); }

/* ==========================================================================
   Rhythm: sections and blocks
   ========================================================================== */
.section { margin-top: var(--gap-section); scroll-margin-top: 72px; }
.section-head + .block { margin-top: var(--space-l); }
.block + .block,
.rings + .block { margin-top: var(--gap-block); }
.block > .t3 + .body + .media-row,
.block > .t3 + .body + .card,
.block > .t3 + .body + .ticker,
.block > .t3 + .card,
.block > .body + .card { margin-top: var(--space-m); }

/* ==========================================================================
   Surfaces
   ========================================================================== */
.card { background: var(--surface); border-radius: var(--radius); padding: var(--card-pad); }

/* fit: contain media inside a sized box so it can never be clipped */
.fit { position: relative; }
.fit > img, .fit > video {
  position: absolute; inset: var(--fit-pad, 24px);
  width: calc(100% - 2 * var(--fit-pad, 24px));
  height: calc(100% - 2 * var(--fit-pad, 24px));
  object-fit: contain;
}

/* ==========================================================================
   Hero + header
   ========================================================================== */
.hero-media { border-radius: var(--radius); overflow: hidden; aspect-ratio: 7 / 4; background: #E7E7EA; }
.hero-media img { width: 100%; height: 100%; object-fit: cover; }

.case-head {
  display: flex; justify-content: space-between; align-items: flex-start; gap: 32px;
  margin-top: var(--space-xl);
}
.case-title { font: 700 var(--h1)/1.1 var(--font-display); letter-spacing: -0.02em; }
.case-sub { margin-top: 6px; color: var(--ink-dim); font-size: 14px; }
.facts { display: flex; gap: 56px; }
.facts dt { font: 500 16px/1.3 var(--font-display); }
.facts dd { margin-top: 4px; color: var(--ink-dim); font-size: 14px; }
@media (max-width: 560px) {
  .case-head { flex-direction: column; gap: 20px; }
  .facts { gap: 40px; }
}

.intro { margin-top: var(--space-xl); }

/* My Roles showcase: one tall card, two stacked wide cards */
.showcase {
  display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 5fr); gap: var(--space-s);
  margin-top: var(--space-xl);
}
.showcase__tall { grid-row: span 2; background: var(--surface); border-radius: var(--radius); }
.showcase__wide { aspect-ratio: 2 / 1; background: var(--surface); border-radius: var(--radius); }
@media (max-width: 760px) {
  .showcase { grid-template-columns: 1fr; }
  .showcase__tall { grid-row: auto; aspect-ratio: 4 / 5; }
}

/* ==========================================================================
   Two-column text + media
   Rule: the first split in each Tier 2 section puts media on the right,
   then splits alternate within that section.
   ========================================================================== */
.split {
  display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr);
  gap: var(--space-xl); align-items: center;
}
.split--media-left { grid-template-columns: minmax(0, 6fr) minmax(0, 5fr); }
.split--phone { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.split--media-left .split__media { order: -1; }
@media (max-width: 760px) {
  .split, .split--media-left, .split--phone { grid-template-columns: 1fr; gap: var(--space-m); }
  .split--media-left .split__media { order: 0; }
}

.problem-img { border-radius: var(--radius-sm); overflow: hidden; }
.problem-img img { width: 100%; height: auto; }

/* single-phone recording cards (Onboarding, Friends & Co-Play, Parental Controls) */
.phone-card { aspect-ratio: 4 / 5; background: var(--surface); border-radius: var(--radius); --fit-pad: 24px; }



/* ==========================================================================
   Gallery
   ========================================================================== */
.page-head { padding-top: var(--space-xl); }
.page-head .t2 { font-size: var(--h1); }

/* an even grid of equal 4:5 tiles */
.gallery { margin-top: var(--space-l); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-m); }
@media (max-width: 860px)  { .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px)  { .gallery { grid-template-columns: 1fr; } }

.piece__open {
  display: block; width: 100%; padding: 0; border: 0; cursor: zoom-in;
  background: var(--surface); border-radius: var(--radius-sm); overflow: hidden;
  position: relative; line-height: 0; aspect-ratio: 4 / 5;
}
.piece__open img { width: 100%; height: 100%; object-fit: cover; display: block; background: #EDEDEF; }
.piece__open::after {
  content: ""; position: absolute; inset: 0; border-radius: var(--radius-sm);
  box-shadow: inset 0 0 0 1px rgba(24, 24, 27, .08); pointer-events: none;
}

/* ==========================================================================
   Viewer
   ========================================================================== */
.viewer {
  width: 100vw; height: 100vh; max-width: 100vw; max-height: 100vh;
  margin: 0; padding: 0; border: 0; background: transparent; overflow: hidden;
}
.viewer::backdrop { background: rgba(12, 12, 14, .94); }
.viewer__stage {
  position: absolute; inset: 0; display: grid; place-items: center;
  overflow: hidden; touch-action: none;
}
.viewer__img {
  max-width: 92vw; max-height: 84vh; object-fit: contain;
  cursor: zoom-in; user-select: none; -webkit-user-drag: none;
}
.viewer.is-zoomed .viewer__img {
  max-width: none; max-height: none; cursor: grab;
}
.viewer.is-zoomed.is-panning .viewer__img { cursor: grabbing; }
.viewer__bar {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  padding: 16px; flex-wrap: wrap;
}
.viewer__top { position: absolute; top: 0; right: 0; z-index: 2; padding: 16px; display: flex; gap: 10px; }
.vbtn {
  appearance: none; cursor: pointer; position: relative;
  min-width: 44px; height: 44px; padding: 0 14px; border-radius: 999px;
  background: rgba(255, 255, 255, .1); color: #fff; border: 1px solid rgba(255, 255, 255, .22);
  font: 500 14px/1 var(--font-body); display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.vbtn:hover { background: rgba(255, 255, 255, .18); }
.vbtn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.viewer__count { color: #fff; font: 500 14px/1 var(--font-body); font-variant-numeric: tabular-nums; opacity: .85; padding: 0 6px; }
.viewer :focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
@media (max-width: 520px) { .viewer__img { max-width: 96vw; max-height: 74vh; } }

/* ==========================================================================
   Motion — same vocabulary as the case studies
   ========================================================================== */
:root { --mo-fast: 130ms; --mo-mid: 260ms; --mo-ease: cubic-bezier(.34, 1.2, .48, 1); }

@media (prefers-reduced-motion: no-preference) {
  .vbtn, .piece__open { transition: transform var(--mo-fast) var(--mo-ease), background-color var(--mo-mid) ease, border-color var(--mo-mid) ease; }
  .vbtn:active { transform: scale(.96); }
  .vbtn::after {
    content: ""; position: absolute; inset: -3px; border-radius: 999px;
    border: 1.5px solid currentColor; opacity: 0; pointer-events: none;
  }
  .is-hit::after { animation: mo-ring 420ms var(--mo-ease); }
  @keyframes mo-ring { 0% { opacity: .8; transform: scale(1); } 100% { opacity: 0; transform: scale(1.12); } }

  @media (hover: hover) {
    .piece__open img { transition: transform var(--mo-mid) var(--mo-ease); }
    .piece__open:hover img { transform: scale(1.03); }
  }

  .viewer[open] { animation: mo-fade var(--mo-mid) var(--mo-ease); }
  .viewer[open]::backdrop { animation: mo-fade var(--mo-mid) var(--mo-ease); }
  .viewer[open] .viewer__img { animation: mo-zoom var(--mo-mid) var(--mo-ease); }
  .viewer.is-closing, .viewer.is-closing::backdrop { animation: mo-fade var(--mo-fast) var(--mo-ease) reverse; }
  .viewer.is-zoomed .viewer__img { animation: none; }
  @keyframes mo-fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes mo-zoom { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: scale(1); } }

  .motion-ready .piece { opacity: 0; transform: translateY(14px);
    transition: opacity var(--mo-mid) var(--mo-ease), transform 380ms var(--mo-ease);
    transition-delay: calc(var(--i, 0) * 60ms); }
  .motion-ready .piece.is-in { opacity: 1; transform: none; }
}

/* ==========================================================================
   Footer
   ========================================================================== */
.site-footer { margin-top: var(--gap-section); border-top: 1px solid var(--line); }
.site-footer__inner {
  max-width: 1240px; margin: 0 auto; padding: 56px 24px 72px;
  display: flex; justify-content: space-between; gap: 40px; flex-wrap: wrap;
}
.site-footer__display { font: 700 32px/1.1 var(--font-display); letter-spacing: -0.01em; }
.site-footer__sub { margin-top: 8px; font-size: 14px; }
.site-footer__cols { display: flex; gap: 72px; }
.site-footer h2 { font: 500 15px/1.3 var(--font-display); margin-bottom: 12px; }
.site-footer ul { list-style: none; margin: 0; padding: 0; }
.site-footer li + li { margin-top: 8px; }
.site-footer ul a { font-size: 14px; color: var(--ink-dim); text-decoration: none; }
.site-footer ul a:hover { color: var(--ink); }

/* --- footer utilities: copy email, reduce motion, back to top ------------ */
.site-footer__bottom {
  flex: 0 0 100%; width: 100%;                 /* own row inside the flex footer */
  margin-top: var(--space-m); padding-top: var(--space-m);
  border-top: 1px solid var(--line);
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px;
}
.footer-btn {
  appearance: none; background: transparent; cursor: pointer;
  border: 1px solid var(--line); border-radius: 999px; padding: 8px 15px;
  font: 500 13px/1 var(--font-body); color: var(--ink-dim); text-decoration: none;
  display: inline-flex; align-items: center; gap: 7px;
}
.footer-btn:hover { color: var(--ink); border-color: #C2C2C9; }
/* beats display:inline-flex, so the script-only buttons stay hidden without JS */
.footer-btn[hidden] { display: none; }
.footer-btn--plain { border-color: transparent; padding-inline: 0; margin-left: auto; }
.footer-btn--plain:hover { border-color: transparent; text-decoration: underline; text-underline-offset: 3px; }
.footer-btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.footer-status {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
/* Author-level motion kill switch. The CSS media query cannot be overridden
   from script, so the toggle collapses durations instead. */
html.motion-off { scroll-behavior: auto !important; }
html.motion-off *, html.motion-off *::before, html.motion-off *::after {
  animation-duration: 1ms !important; animation-delay: 0ms !important;
  animation-iteration-count: 1 !important;
  transition-duration: 1ms !important; transition-delay: 0ms !important;
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
}

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* ==========================================================================
   Global header
   The same on every page. Fixed: transparent over the home hero until the
   page scrolls, solid from the start everywhere else (site-header--solid).
   It carries its own colours and type, so no page theme can restyle it.
   ========================================================================== */
/* One height for the header, scrolled or not, on every page: nothing in it
   moves when the page scrolls or changes. Anchors and sticky elements read it. */
:root { --site-header-h: 84px; }
html { scroll-padding-top: var(--site-header-h); }

.site-header {
  --nav-paper: #F8F7F4; --nav-ink: #111216; --nav-muted: #656B7C; --nav-link: #51586C;
  --nav-line: #DEDFE2; --nav-accent: #F3480B; --nav-accent-text: #C53606;
  --nav-ease: cubic-bezier(.22, 1, .36, 1);
  position: fixed; inset: 0 0 auto; z-index: 40;
  /* content sits in the site's one container, 1192px wide with 24px gutters:
     the same as the case studies, gallery, 404, footers and home page */
  height: var(--site-header-h); padding: 0 max(24px, calc((100% - 1192px) / 2));
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid transparent;
  color: var(--nav-ink); font: 400 16px/1.7 "Manrope", "Segoe UI", sans-serif;
  letter-spacing: normal; text-transform: none; -webkit-font-smoothing: antialiased;
}
.site-header--solid, .site-header[data-scrolled="true"], html:not(.js) .site-header {
  background: var(--nav-paper); border-bottom-color: var(--nav-line);
}
/* keeps the page clear of the fixed header where no hero sits under it */
.site-header__spacer { height: var(--site-header-h); }
.skip-link:focus { z-index: 100; }

.site-header a { color: inherit; text-decoration: none; }
.site-header :focus-visible { outline: 2px solid var(--nav-accent); outline-offset: 6px; }
.wordmark:focus-visible, .main-nav a:not(.nav-contact):focus-visible { border-radius: 0; }
.site-header svg { display: block; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.wordmark { display: flex; align-items: center; gap: 15px; flex-shrink: 0; font-size: 13px; font-weight: 600; line-height: 1.25; }
.monogram { font: 700 38px/1 "Bricolage Grotesque", Arial, sans-serif; letter-spacing: -0.1em; padding-right: .1em; }
.monogram span { color: var(--nav-accent); }
.wordmark__copy { display: grid; gap: 3px; }
.wordmark__copy strong { color: var(--nav-ink); font-size: 14px; font-weight: 700; letter-spacing: -0.035em; }
.wordmark__copy small { color: var(--nav-muted); font-size: 12px; font-weight: 500; }

.main-nav {
  display: flex; align-items: center; gap: clamp(18px, 3vw, 48px);
  margin-left: auto;
  font-size: 14px; font-weight: 500;
}
.main-nav a { position: relative; padding: 12px 0; color: var(--nav-link); }
.main-nav a:hover, .main-nav a[aria-current] { color: var(--nav-ink); }
/* the current page (on a case study, Work) and the hovered link get a dot */
.main-nav a::after {
  content: ""; position: absolute; bottom: 1px; left: 50%;
  width: 6px; height: 6px; border-radius: 50%; background: var(--nav-accent);
  transform: translateX(-50%) scale(0);
}
.main-nav a:hover::after, .main-nav a[aria-current]::after { transform: translateX(-50%) scale(1); }
.main-nav .nav-contact {

/* Moving between pages. The page cross-fades instead of flashing, and the
   header is a layer of its own, so it holds still while the page changes
   under it. Typed (page-nav) so a page's own same-page transitions, like the
   Vibe Coding simulator's, keep their rules. Reduce motion skips it; browsers
   without cross-document view transitions simply navigate. */
@view-transition { navigation: auto; types: page-nav; }
.site-header { view-transition-name: site-header; }
html:active-view-transition-type(page-nav)::view-transition-old(root) { animation: 260ms cubic-bezier(.4, 0, .2, 1) both page-out; mix-blend-mode: plus-lighter; }
html:active-view-transition-type(page-nav)::view-transition-new(root) { animation: 260ms cubic-bezier(.4, 0, .2, 1) both page-in; mix-blend-mode: plus-lighter; }
@keyframes page-out { to { opacity: 0; } }
@keyframes page-in { from { opacity: 0; } }
html.motion-off::view-transition-group(*),
html.motion-off::view-transition-old(*),
html.motion-off::view-transition-new(*) { animation: none !important; }

<script>
/* Global header, the same on every page: solid once the page leaves the top,
   and the phone menu. */
(function () {
  "use strict";
  var header = document.querySelector(".site-header");
  if (!header) return;

  var frame = 0;
  var paint = function () {
    frame = 0;
    header.setAttribute("data-scrolled", window.scrollY > 40 ? "true" : "false");
  };
  window.addEventListener("scroll", function () {
    if (!frame) frame = window.requestAnimationFrame(paint);
  }, { passive: true });
  paint();

  var toggle = document.getElementById("menu-toggle");
  var nav = document.getElementById("main-nav");
  if (!toggle || !nav) return;
  toggle.hidden = false;
  var isOpen = function () { return nav.classList.contains("open"); };
  var setMenu = function (open, returnFocus) {
    nav.classList.toggle("open", open);
    toggle.setAttribute("aria-expanded", open ? "true" : "false");
    toggle.setAttribute("aria-label", open ? "Close menu" : "Open menu");
    if (open) {
      var first = nav.querySelector("a");
      if (first) first.focus({ preventScroll: true });
    } else if (returnFocus) {
      toggle.focus();
    }
  };
  toggle.addEventListener("click", function () { setMenu(!isOpen()); });
  nav.addEventListener("click", function (e) { if (isOpen() && e.target.closest("a")) setMenu(false); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && isOpen()) setMenu(false, true); });
  document.addEventListener("pointerdown", function (e) { if (isOpen() && !header.contains(e.target)) setMenu(false); });
  header.addEventListener("focusout", function (e) {
    if (isOpen() && e.relatedTarget && !header.contains(e.relatedTarget)) setMenu(false);
  });
}());
</script>

<script>
(function () {
  "use strict";

  /* ------------------------------------------------------------------ data
     The only facts known about these files are their id, format and pixel
     size. Fill in title / year / medium / alt here and the page will use
     them; until then it shows no captions and neutral alt text. */
  var PIECES = [
    { id: "pn2Jgi2titY05EUATOa3Y7ea3E", ext: "png", w: 2254, h: 2000, orient: "landscape", title: "", year: "", medium: "", alt: "" },
    { id: "3ZDxyTsRmwMAxQRYoGSvxVnF18", ext: "png", w: 3912, h: 5294, orient: "portrait", title: "", year: "", medium: "", alt: "" },
    { id: "Ym60n3KDMM98H7c7oJw7LjKmBk", ext: "png", w: 4000, h: 3000, orient: "landscape", title: "", year: "", medium: "", alt: "" },
    { id: "dIqZEaIS5jPMlG4JyzL0o6iwMM", ext: "png", w: 7000, h: 4789, orient: "landscape", title: "", year: "", medium: "", alt: "" },
    { id: "l3PvLM5cF1ek1T48OFk8yTJlnSk", ext: "png", w: 3000, h: 2250, orient: "landscape", title: "", year: "", medium: "", alt: "" },
    { id: "hGRdwGYtUFRMOd6EblRUjuaOek", ext: "png", w: 2400, h: 2381, orient: "square", title: "", year: "", medium: "", alt: "" },
    { id: "5bdZuDbIZl2l6yFofZo0DeB3KTQ", ext: "jpg", w: 1521, h: 919, orient: "landscape", title: "", year: "", medium: "", alt: "" },
    { id: "wcrI1ADtrEhe3ljXEcKEvZN0QA", ext: "jpg", w: 1536, h: 2048, orient: "portrait", title: "", year: "", medium: "", alt: "" },
    { id: "eoLFUf36qx62muV2YFoZgllODE", ext: "jpg", w: 2048, h: 1500, orient: "landscape", title: "", year: "", medium: "", alt: "" }
  ];
  var CDN = "https://framerusercontent.com/images/";
  function src(p, size) { return CDN + p.id + "." + p.ext + "?scale-down-to=" + size; }
  function label(p, i) { return p.alt || p.title || ("Gallery piece " + (i + 1)); }

  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
  var gallery = document.getElementById("gallery");
  var figures = Array.prototype.slice.call(gallery.querySelectorAll(".piece"));

  /* --------------------------------------------------------------- viewer */
  var dlg = document.getElementById("viewer");
  var vImg = document.getElementById("v-img");
  var vCount = document.getElementById("v-count");
  var vZoom = document.getElementById("v-zoom");
  var vZoomLabel = document.getElementById("v-zoom-label");
  var stage = document.getElementById("v-stage");
  var current = 0, opener = null, zoomed = false;
  var pan = { x: 0, y: 0 }, drag = null;

  function setZoom(on) {
    zoomed = on;
    dlg.classList.toggle("is-zoomed", on);
    vZoom.setAttribute("aria-pressed", on ? "true" : "false");
    vZoomLabel.textContent = on ? "Fit to screen" : "Zoom in";
    vImg.style.transform = "";
    pan.x = pan.y = 0;
    if (on) {
      var p = PIECES[current];
      /* never upscale past the file we actually fetch */
      var max = Math.min(p.w, 4096);
      vImg.style.width = max + "px";
      vImg.style.height = "auto";
      vImg.src = src(p, 4096);                 /* a sharper file once zoomed */
    } else {
      vImg.style.width = "";
      vImg.style.height = "";
    }
  }
  function show(i) {
    current = i;
    var p = PIECES[i];
    setZoom(false);
    vImg.src = src(p, 1600);
    vImg.alt = label(p, i);
    vCount.textContent = (i + 1) + " / " + PIECES.length;
  }
  function step(dir) {
    show((current + dir + PIECES.length) % PIECES.length);
  }
  function open(i, from) {
    opener = from || null;
    document.body.style.overflow = "hidden";
    show(i);
    dlg.showModal();
    document.getElementById("v-close").focus();
  }
  function close() {
    if (!reduce.matches) {
      dlg.classList.add("is-closing");
      window.setTimeout(function () { dlg.classList.remove("is-closing"); dlg.close(); }, 140);
    } else { dlg.close(); }
  }
  dlg.addEventListener("close", function () {
    document.body.style.overflow = "";
    setZoom(false);
    if (opener) opener.focus();
  });

  Array.prototype.forEach.call(document.querySelectorAll("[data-piece]"), function (btn) {
    btn.addEventListener("click", function () { open(parseInt(btn.getAttribute("data-piece"), 10), btn); });
  });
  document.getElementById("v-close").addEventListener("click", close);
  document.getElementById("v-prev").addEventListener("click", function () { step(-1); });
  document.getElementById("v-next").addEventListener("click", function () { step(1); });
  vZoom.addEventListener("click", function () { setZoom(!zoomed); });
  vImg.addEventListener("click", function (e) { if (!drag || !drag.moved) setZoom(!zoomed); e.stopPropagation(); });

  dlg.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") { e.preventDefault(); step(1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); step(-1); }
    else if (e.key === "+" || e.key === "=") { e.preventDefault(); setZoom(true); }
    else if (e.key === "-" || e.key === "0") { e.preventDefault(); setZoom(false); }
  });

  /* drag to pan when zoomed, swipe to move between pieces when not */
  stage.addEventListener("pointerdown", function (e) {
    drag = { x: e.clientX, y: e.clientY, px: pan.x, py: pan.y, moved: false, id: e.pointerId };
    if (zoomed) { dlg.classList.add("is-panning"); stage.setPointerCapture(e.pointerId); }
  });
  stage.addEventListener("pointermove", function (e) {
    if (!drag || e.pointerId !== drag.id) return;
    var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.abs(dx) > 6 || Math.abs(dy) > 6) drag.moved = true;
    if (!zoomed) return;
    pan.x = drag.px + dx; pan.y = drag.py + dy;
    vImg.style.transform = "translate(" + pan.x + "px," + pan.y + "px)";
  });
  function endDrag(e) {
    if (!drag) return;
    if (!zoomed && drag.moved) {
      var dx = e.clientX - drag.x;
      if (Math.abs(dx) > 50) step(dx < 0 ? 1 : -1);
    }
    dlg.classList.remove("is-panning");
    window.setTimeout(function () { drag = null; }, 0);
  }
  stage.addEventListener("pointerup", endDrag);
  stage.addEventListener("pointercancel", endDrag);
  /* clicking the empty area around the image closes */
  stage.addEventListener("click", function (e) {
    if (e.target === stage && (!drag || !drag.moved)) close();
  });

  /* --------------------------------------------------------------- motion */
  if (!reduce.matches && "IntersectionObserver" in window) {
    document.documentElement.classList.add("motion-ready");
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (!e.isIntersecting) return;
        e.target.classList.add("is-in");
        io.unobserve(e.target);
      });
    }, { rootMargin: "0px 0px -10% 0px", threshold: 0.1 });
    figures.forEach(function (f) { io.observe(f); });
    window.requestAnimationFrame(function () {
      figures.forEach(function (f) {
        var r = f.getBoundingClientRect();
        if (r.top < window.innerHeight && r.bottom > 0) f.classList.add("is-in");
      });
    });
    document.addEventListener("click", function (e) {
      var b = e.target.closest(".vbtn");
      if (!b) return;
      b.classList.remove("is-hit"); void b.offsetWidth; b.classList.add("is-hit");
      b.addEventListener("animationend", function h() {
        b.classList.remove("is-hit"); b.removeEventListener("animationend", h);
      });
    });
  }
}());
</script>
<script>
/* Footer utilities. The copy button is revealed only once this runs, so it is
   never present as a dead control when JavaScript is off. */
(function () {
  "use strict";

  /* ------------------------------------------------------- copy the email */
  var copyBtn = document.getElementById("copy-email");
  var label   = document.getElementById("copy-email-label");
  var status  = document.getElementById("footer-status");
  if (copyBtn && label && navigator.clipboard && navigator.clipboard.writeText) {
    copyBtn.hidden = false;
    var resetTimer = 0;
    copyBtn.addEventListener("click", function () {
      var email = copyBtn.getAttribute("data-email");
      navigator.clipboard.writeText(email).then(function () {
        label.textContent = "Copied";
        if (status) status.textContent = "Email address copied.";
      }, function () {
        label.textContent = "Press Ctrl+C";
        if (status) status.textContent = "Copy failed. The address is " + email;
      });
      window.clearTimeout(resetTimer);
      resetTimer = window.setTimeout(function () {
        label.textContent = "Copy email";
        if (status) status.textContent = "";
      }, 2400);
    });
  }

})();
</script>
